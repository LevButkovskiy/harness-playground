<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>harness</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f8fafc;
      color: #0f172a;
      font-family: system-ui, sans-serif;
    }

    .container {
      text-align: center;
      padding: 24px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 48px;
    }

    p {
      margin: 0 0 24px;
      font-size: 18px;
      color: #475569;
    }

    .button {
      display: inline-block;
      padding: 12px 28px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: #ffffff;
      font: inherit;
      font-size: 16px;
      text-decoration: none;
      cursor: pointer;
    }

    .button:hover {
      background: #1d4ed8;
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>harness</h1>
    <p>агенты работают по этапам</p>
    <button class="button">Начать</button>
  </main>
</body>
</html>
