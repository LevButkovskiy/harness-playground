<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>harness</title>
  <style>
    /* Центрируем всё содержимое по экрану */
    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 24px;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      color: #111827;
      background: #ffffff;
    }

    h1 {
      margin: 0;
      font-size: 3rem;
    }

    p {
      margin: 0;
      font-size: 1.25rem;
      color: #4b5563;
    }

    button {
      margin-top: 8px;
      padding: 12px 28px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: #ffffff;
      font-size: 1rem;
      font-family: inherit;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    button:hover {
      background: #1d4ed8;
    }
  </style>
</head>
<body>
  <h1>harness</h1>
  <p>агенты работают по этапам</p>
  <button type="button">Начать</button>
</body>
</html>
